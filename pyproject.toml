[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-simulator"
version = "0.1.0"
description = "Cache simulator: direct-mapped/set-associative/fully associative, LRU/FIFO/random, 3C miss classification, AMAT."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nima Azami" }]
dependencies = ["numpy>=1.24"]
keywords = ["computer-architecture", "cache", "simulator"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
